# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. PyPI trusted publishing:
# no token is stored anywhere. One-time setup on pypi.org, under "Publishing" in the
# account: add a pending publisher with project strands-proxmint, owner proxmint,
# repository strands-proxmint, workflow publish.yml, environment pypi.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group test pytest -q
      - run: uv build
      - run: uv publish
