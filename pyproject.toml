[project]
name = "strands-proxmint"
version = "0.1.0"
description = "Strands Agents tool that reads web pages through Proxmint residential, datacenter and mobile proxies, with country, city and ASN targeting and sticky sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Proxmint", email = "support@proxmint.com" }]
keywords = ["strands", "strands-agents", "proxy", "residential-proxy", "web-scraping", "agents", "proxmint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["strands-agents>=1.0", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://proxmint.com"
Documentation = "https://proxmint.com/docs/strands"
Repository = "https://github.com/proxmint/strands-proxmint"
Issues = "https://github.com/proxmint/strands-proxmint/issues"

[dependency-groups]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_proxmint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
